x-anchor-launch:
  entrypoint: bin/deploy
  offline_target: isolated-production-topology-rehearsal
  production_evidence: required
  readiness_review: ops/runbooks/production_launch.md
  independent_versions: [prompt, model, index]
  required_controls: [tenancy, auth, quotas, redaction, guarded_tools, tracing, rollback, backup_restore, kill_switch]
services:
  rails:
    deploy:
      replicas: 1
  ai-runtime:
    environment:
      ANCHOR_DEPLOYMENT_CONFIG: config/provider_routing.yml
      ANCHOR_DEPLOY_ROUTE: ${ANCHOR_DEPLOY_ROUTE:-fake}
    deploy:
      replicas: 2
  worker:
    deploy:
      replicas: 1
