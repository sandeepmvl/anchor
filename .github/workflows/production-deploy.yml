name: Anchor production deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anchor-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, anchor-integration]
    environment: production
    timeout-minutes: 30
    env:
      RAILS_ENV: test
      ANCHOR_EVAL_EVIDENCE: ${{ vars.ANCHOR_EVAL_EVIDENCE }}
      ANCHOR_SECURITY_EVIDENCE: ${{ vars.ANCHOR_SECURITY_EVIDENCE }}
      ANCHOR_EVAL_ADAPTER: ${{ vars.ANCHOR_EVAL_ADAPTER }}
      ANCHOR_AI_SECRET: ${{ secrets.ANCHOR_AI_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: python -m pip install -r anchor_ai/requirements.txt
      - run: python3 bin/deploy production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-evidence-${{ github.sha }}
          path: .git/anchor-eval/
          include-hidden-files: true
