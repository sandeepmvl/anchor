name: Retrieval regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  accumulated-tests:
    runs-on: ubuntu-latest
    env:
      ANCHOR_LLM_PROVIDER: offline
      ANCHOR_QUERY_PROVIDER: offline
      ANCHOR_EMBEDDING_PROVIDER: offline
      ANCHOR_EVAL_PROVIDER: offline
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: anchor_ai/requirements.txt
      - name: Python dependencies
        run: |
          python -m pip install -r anchor_ai/requirements.txt
          python -m pip install pytest httpx fastapi pydantic pyyaml rank-bm25 numpy scipy scikit-learn
      # Preference alignment lesson 3688
      - name: Preference data and offline alignment evidence
        run: |
          python bin/build_preference_dataset.py --source eval/finetune/fixtures/preference_transcripts.jsonl --tenant demo --out eval/finetune/preferences.jsonl
          python bin/analyze_dpo.py --logs eval/finetune/fixtures/dpo_training_log.jsonl --replies eval/finetune/fixtures/dpo_heldout_replies.jsonl
          python eval/model_gate.py --offline --candidate dpo-recorded
      - name: Accumulated AI unit and trajectory tests
        run: python -m pytest -q anchor_ai/tests
      - name: Versioned offline retrieval gate
        run: python eval/retrieval_gate.py
      - name: SFT experiment and recorded evidence contract
        run: |
          python bin/train_sft.py --offline --config config/fine_tuning.yml
          python bin/analyze_loss.py --log eval/finetune/fixtures/sft_epochs8.jsonl
          python eval/model_gate.py --offline --candidate sft-recorded
      - name: Adapter arithmetic and offline release lifecycle
        run: |
          python labs/adapter-merging/merge_adapter.py --fixture eval/finetune/fixtures/qlora-adapter
          python eval/model_gate.py --offline --candidate adapter-recorded
          python -m pytest -q anchor_ai/tests/test_adapter_release.py
          # Promotion now requires separately supplied complete consolidated evidence.
          # The lifecycle test exercises promotion and rollback with bound offline evidence.
      - name: Document-level dense versus hybrid benchmark
        run: python -m eval.retrieval_eval --details
      - name: Fresh endpoint parity
        run: python -m eval.eval_endpoint --testclient --output .git/anchor-endpoint-eval
      - name: Golden answer and trajectory gate
        run: python -m eval.rag_gate
      - name: Bounded agent golden trajectory gate
        run: python eval/agent_gate.py
      - name: Endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-evaluation
          path: .git/anchor-endpoint-eval/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Accumulated Rails CI
        run: bin/ci
