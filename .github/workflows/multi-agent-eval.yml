name: Multi-agent release gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: [self-hosted, anchor-integration]
    timeout-minutes: 15
    env:
      ANCHOR_ORCHESTRATION_RELEASE_ADAPTER: ${{ vars.ANCHOR_ORCHESTRATION_RELEASE_ADAPTER }}
      ANCHOR_MULTI_AGENT_JUDGE_RECORDINGS: ${{ vars.ANCHOR_MULTI_AGENT_JUDGE_RECORDINGS }}
      ANCHOR_AI_SECRET: ${{ secrets.ANCHOR_AI_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Accumulated product gates
        run: |
          bin/rails test
          python3 -m pytest -q anchor_ai/tests
          python3 eval/retrieval_gate.py
          python3 eval/rag_gate.py
          python3 eval/agent_gate.py
          python3 eval/multi_agent_gate.py
      - name: Consolidated release ownership
        run: echo 'Anchor release gate in eval-gate.yml owns manifest comparison and required merge status'
