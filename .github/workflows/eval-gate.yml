name: Anchor consolidated evaluation
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
  actions: read
env:
  EVAL_TIER: ${{ github.event_name == 'pull_request' && 'sample' || 'full' }}
  ANCHOR_EVAL_ADAPTER: ${{ vars.ANCHOR_EVAL_ADAPTER }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANCHOR_AI_SECRET: ${{ secrets.ANCHOR_AI_SECRET }}
  ANCHOR_SECURITY_EVIDENCE: ${{ vars.ANCHOR_SECURITY_EVIDENCE }}
concurrency:
  group: anchor-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate:
    runs-on: [self-hosted, anchor-integration]
    timeout-minutes: 10
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: anchor_eval
          POSTGRES_USER: anchor_eval
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U anchor_eval -d anchor_eval'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANCHOR_EVAL_DATABASE_URL: postgresql://anchor_eval:local-ci-only@localhost:5432/anchor_eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m eval.release_gate candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: .git/anchor-eval/candidate.json
          include-hidden-files: true
          if-no-files-found: error
  evaluators:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        check: [golden, calibration, trajectory, regression]
    runs-on: [self-hosted, anchor-integration]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: .git/anchor-eval
      - run: python -m eval.release_gate ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.check }}
          path: .git/anchor-eval/${{ matrix.check }}.json
          include-hidden-files: true
          if-no-files-found: error
  accumulated:
    runs-on: [self-hosted, anchor-integration]
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      ANCHOR_LLM_PROVIDER: offline
      ANCHOR_QUERY_PROVIDER: offline
      ANCHOR_EMBEDDING_PROVIDER: offline
      ANCHOR_EVAL_PROVIDER: offline
      ANCHOR_ORCHESTRATION_RELEASE_ADAPTER: ${{ vars.ANCHOR_ORCHESTRATION_RELEASE_ADAPTER }}
      ANCHOR_MULTI_AGENT_JUDGE_RECORDINGS: ${{ vars.ANCHOR_MULTI_AGENT_JUDGE_RECORDINGS }}
      ANCHOR_REALTIME_RELEASE_EVIDENCE: ${{ vars.ANCHOR_REALTIME_RELEASE_EVIDENCE }}
      ANCHOR_REDTEAM_ADAPTER: ${{ vars.ANCHOR_REDTEAM_ADAPTER }}
      ANCHOR_REDTEAM_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: python -m pip install -r anchor_ai/requirements.txt
      - run: ruby test/integration/failover_budget_incident_test.rb
      - run: python -m pytest -q anchor_ai/tests/test_failover_budget_incident.py
      - run: python eval/regression_gate.py --incident-only
      - run: bin/rails db:prepare
      - name: Launch permission, isolation, quota, redaction, tool and handoff evidence
        run: ruby test/integration/production_launch_test.rb --deployed
      - run: bin/rails test
      - run: python -m pytest -q anchor_ai/tests
      - name: Security harness offline integration
        run: ruby test/integration/redteam_harness_test.rb
      - name: Full offline security composition
        run: ruby bin/redteam_harness.rb --suite full --target hardened_release
      - name: Candidate endpoint security gate
        run: python -m eval.redteam_gate --release
      - run: python eval/retrieval_gate.py
      - run: python eval/rag_gate.py
      - run: python eval/agent_gate.py
      - run: python eval/multi_agent_gate.py
      - run: python -m eval.agent_gate --multimodal
      - run: python -m eval.agent_gate --multimodal --fault multimodal --expect-rejection
      - run: python -m eval.agent_gate --realtime-release --release-evidence "$ANCHOR_REALTIME_RELEASE_EVIDENCE"
  gate:
    name: Anchor release gate
    if: always()
    needs: [candidate, evaluators, accumulated]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RESULT: ${{ needs.candidate.result }}
      EVALUATORS_RESULT: ${{ needs.evaluators.result }}
      ACCUMULATED_RESULT: ${{ needs.accumulated.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: .git/anchor-eval
      - name: Find and fetch successful full main baseline
        run: python -m eval.release_gate baseline
      - name: Validate production security evidence
        if: always()
        run: python -m labs.security_hardening.milestone --release
      - name: Always decide and publish redacted dashboard
        if: always()
        run: |
          export NEEDS_JSON="$(python -c 'import json,os; print(json.dumps({**{n:{"result":os.environ["EVALUATORS_RESULT"]} for n in ("golden","calibration","trajectory","regression")},"candidate":{"result":os.environ["CANDIDATE_RESULT"]},"accumulated":{"result":os.environ["ACCUMULATED_RESULT"]}}))')"
          python -m eval.release_gate decide
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-dashboard
          path: |
            .git/anchor-eval/dashboard.md
            .git/anchor-eval/evidence.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main' && env.EVAL_TIER == 'full'
        with:
          name: anchor-baseline
          path: .git/anchor-eval/baseline.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
