version: 1
methods: [prompt, RAG, fine-tune]
tie_order: [prompt, RAG, fine-tune]
knowledge_volatility_range: [1, 5]
axes:
  freshness:
    current: [0, 4, 0]
    stable: [1, 0, 2]
  target:
    format: [4, 0, 0]
    tone: [1, 0, 4]
    knowledge: [0, 4, 0]
  labels:
    missing: [2, 0, 0]
    ready: [0, 0, 3]
  latency:
    flexible: [0, 0, 0]
    tight: [1, 0, 1]
  request_cost:
    normal: [0, 0, 0]
    pressure: [1, 0, 1]
  maintenance:
    lean: [2, 0, 0]
    funded: [0, 1, 2]
dataset:
  rubric_version: refund-response-v1
  labels: [refund_review, refund_decline]
  near_duplicate_threshold: 0.85
  input_length: [20, 2000]
  output_length: [20, 1000]
  splits: [train, validation, held_out]
  status: candidate_export_not_training_release
  readiness_checks:
    - reviewed_context_targets_and_labels
    - pii_flag_and_defer_plus_redaction_and_human_review
    - authorized_tenant_and_permitted_training_use
    - inspected_duplicates_and_grouped_splits
    - declared_label_coverage
    - independent_golden_dataset_and_judge_regression_gate

synthetic:
  reject_rate_band: [0.2, 0.6]
  max_synthetic_real_ratio: 1.0
  source_paths:
    - eval/finetune/train.jsonl
    - eval/finetune/validation.jsonl
    - eval/finetune/held_out.jsonl
  approved_outputs:
    refund_review: We will send this request for human review.
    refund_decline: We cannot approve this request under the reviewed criteria.

sft:
  evidence_source: constructed_recording_not_measured
  candidate: sft-recorded
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  base_revision: recorded-teaching-revision
  tokenizer_revision: recorded-teaching-revision
  chat_template: recorded-user-assistant-v1
  settings:
    full_parameter: true
    optimizer: AdamW
    learning_rate: 0.00002
    sequence_length: 512
    micro_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    epochs: 8
    eval_strategy: epoch
    save_strategy: epoch
    completion_only_loss: true
    parameter_count: 500000000
    bytes_per_parameter: 16
    gpu_budget_bytes: 16000000000
  loss_log: eval/finetune/fixtures/sft_epochs8.jsonl
  heldout_replies: eval/finetune/fixtures/sft_heldout_replies.jsonl
  acceptance:
    min_quality: 1.0
    max_critical_failures: 0
  recorded_rows:
    - {id: t1, family: train-return, split: train, source: curated, status: recorded_approved, input: 'Unopened return at 20 days; policy permits 30 days.', output: 'Within the window. Please provide your order reference.'}
    - {id: t2, family: train-return, split: train, source: synthetic, status: recorded_accepted, seed_id: t1, input: 'Still sealed after twenty days; policy permits thirty days.', output: 'Within the window. Please provide your order reference.'}
    - {id: v1, family: validation-decline, split: validation, source: curated, status: recorded_approved, input: 'Opened return at 70 days; policy permits unopened items within 30 days.', output: 'This does not meet the stated criteria. We can request human review.'}
    - {id: h1, family: heldout-return, split: held_out, source: curated, status: recorded_approved, input: 'Sealed item at 12 days; current policy allows unopened returns within 30 days.', output: 'Within the window. Please provide your order reference.'}
    - {id: h2, family: heldout-review, split: held_out, source: curated, status: recorded_approved, input: 'Opened item at 45 days; policy permits unopened returns within 30 days.', output: 'This is outside the stated criteria. We can request human review.'}
