version: 1
methods: [prompt, RAG, fine-tune]
tie_order: [prompt, RAG, fine-tune]
knowledge_volatility_range: [1, 5]
axes:
  freshness:
    current: [0, 4, 0]
    stable: [1, 0, 2]
  target:
    format: [4, 0, 0]
    tone: [1, 0, 4]
    knowledge: [0, 4, 0]
  labels:
    missing: [2, 0, 0]
    ready: [0, 0, 3]
  latency:
    flexible: [0, 0, 0]
    tight: [1, 0, 1]
  request_cost:
    normal: [0, 0, 0]
    pressure: [1, 0, 1]
  maintenance:
    lean: [2, 0, 0]
    funded: [0, 1, 2]
dataset:
  rubric_version: refund-response-v1
  labels: [refund_review, refund_decline]
  near_duplicate_threshold: 0.85
  input_length: [20, 2000]
  output_length: [20, 1000]
  splits: [train, validation, held_out]
  status: candidate_export_not_training_release
  readiness_checks:
    - reviewed_context_targets_and_labels
    - pii_flag_and_defer_plus_redaction_and_human_review
    - authorized_tenant_and_permitted_training_use
    - inspected_duplicates_and_grouped_splits
    - declared_label_coverage
    - independent_golden_dataset_and_judge_regression_gate
