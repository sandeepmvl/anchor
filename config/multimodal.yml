# These settings govern screenshot analysis, not PDF rasterization.
# PDF extraction uses anchor_ai.ocr.Limits and explicit engine selection.
# Keep this schema unchanged: the existing vision service validates its keys.
# Ticket attachments use attachment_evidence.MIN_CONFIDENCE and MAX_BYTES.
# Voice is separate: audio.MAX_UPLOAD=24000000, CHUNK_SECONDS=240,
# CHUNK_BYTES=8000000; MultimodalClient::AUDIO_MAX_BYTES bounds Rails ingress.
# Production voice extraction refuses the offline fixture recognizer.
provider: offline
external_calls: false
model: gpt-4o-mini
max_body_bytes: 2900000
max_encoded_chars: 2800000
max_image_bytes: 2000000
max_edge: 768
max_pixels: 589824
max_output_tokens: 512

# Realtime: ANCHOR_REALTIME_ADAPTER supplies live ports and shared reservations.
# PCM ingress: 20 ms mono PCM16 at 16 kHz; four pending output events.
# Deadlines: STT 200 ms, text chunk 300 ms, TTS chunk 200 ms, send 100 ms.
# Fixture measurements do not verify recognition, network, or audible latency.
