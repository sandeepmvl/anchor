development:
  recover_ai_tasks:
    command: "AiTaskDispatcher.sweep"
    schedule: every minute
production:
  validate_operations_schedule:
    command: "Kernel.system('ruby', 'labs/production-operations/worker_recovery.rb', 'maintenance', exception: true)"
    schedule: every day at 08:00
  recover_ai_tasks:
    command: "AiTaskDispatcher.sweep"
    schedule: every minute
  # Snapshot creation is not restore verification. Daily verification ownership,
  # index review and credential/model review live in ops/maintenance/schedule.yml.
  # Those owner tasks are not automatically executed by this scheduler.
  snapshot_anchor_state:
    command: "Kernel.system('sh', 'ops/backups/backup_snapshot.sh', exception: true)"
    schedule: every hour
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour
