ticket_spike:
  scope: benchmark_only
  record_content: false
  workers: 4
  tenant_pending: 4
  tenant_requests: 30
  tenant_cost_units: 20
  timeout_s: 2.0
  p99_objective_ms: 100
  queue_objective_ms: 20

profiling:
  enabled: true
  samples: 20
  scope: in_process_offline
  percentile: nearest_rank
  remainder_limit: 0.10
  record_content: false
stream_pacing:
  enabled: false
  target_interval: 0.025
  chunk_chars: 3
  max_buffer_chars: 96
  max_flush_delay: 0.12

semantic_cache:
  replay_scope: in_process_offline
  record_content: false
  evidence: policy_not_embedding_quality

provider_prompt_cache:
  record_content: false
  price_basis: illustrative
  policies:
    default:
      ttl_seconds: 300
      prices: {base: '1.00', read: '0.10', write: '1.25'}
    extended:
      ttl_seconds: 3600
      prices: {base: '1.00', read: '0.10', write: '2.00'}
