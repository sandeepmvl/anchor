shared:
  provider: <%= ENV.fetch("ANCHOR_LLM_PROVIDER", "stub").inspect %>
  url: <%= ENV.fetch("ANCHOR_AI_URL", "http://127.0.0.1:8000/v1/infer").inspect %>
  open_timeout: <%= ENV.fetch("ANCHOR_AI_OPEN_TIMEOUT", "2").inspect %>
  # Python's four-second total deadline must remain below this read timeout.
  read_timeout: <%= ENV.fetch("ANCHOR_AI_READ_TIMEOUT", "5").inspect %>
  default_prompt_version: <%= ENV.fetch("ANCHOR_CHAT_PROMPT_VERSION", "chat:v1").inspect %>
  provider_prefix_layout_version: triage-prefix:v1
  # Explicit AI-service composition only; this does not reroute existing Rails callers.
  provider_routing_policy: config/provider_routing.yml
  provider_routing_enabled: false
  # Both processes receive this operator setting; never accept it from params.
  backend: <%= ENV.fetch("LLM_BACKEND", "hosted").inspect %>
  self_hosted_transport: <%= ENV.fetch("ANCHOR_VLLM_TRANSPORT", "offline").inspect %>
