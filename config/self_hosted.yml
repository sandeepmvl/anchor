version: 1
record_content: false
host: 127.0.0.1
port: 8765
model_alias: tiny-llama
samples: 8
max_new_tokens: 32
batching: single_request
# Per-rank planning assumptions, not measured GPU evidence.
kv_cache:
  model:
    layers: 22
    num_key_value_heads: 4
    head_dimension: 64
    dtype: float16
  tensor_parallel_size: 1
  vram_bytes_per_rank: 4000000000
  weights_bytes_per_rank: 2200000000
  overhead_bytes_per_rank: 500000000
  block_size: 16
  gpu_memory_utilization: 0.85
  max_model_len: 512
  max_num_seqs: 4
  max_metric_age_s: 5
  pressure_threshold: 0.90
# Preserve the earlier single-request benchmark; surge profiles are opt-in.
batching_profiles:
  version: 1
  selected: default
  default:
    max_num_seqs: 4
    max_num_batched_tokens: 128
  tuned:
    max_num_seqs: 16
    max_num_batched_tokens: 512
  admission:
    tenant_inflight_limit: 30
    tenant_token_quota: 3000
    request_deadline_s: 4
assumptions:
  basis: simulated_not_hardware_evidence
  parameters: 1100000000
  bytes_per_weight: 2
  layers: 22
  kv_heads: 4
  head_dimension: 64
  bytes_per_kv_element: 2
  context_tokens: 512
  memory_budget_bytes: 4000000000
artifacts:
  max_quality_loss: 0.0
  min_pass_rate: 1.0
  compatible_runtimes:
    fp16: [vllm_gpu, llama_cpp_cpu]
    gptq: [vllm_gpu]
    awq: [vllm_gpu]
    gguf: [llama_cpp_cpu]
  vllm_launch:
    executable: vllm
    subcommand: serve
    model_path: /srv/anchor/models/approved
    served_model_name: tiny-llama
    host: 127.0.0.1
    port: 8765
    supported_formats: [fp16, gptq, awq]
    approval_required: true
serving_adapter:
  backend: self_hosted
  transport_environment: ANCHOR_VLLM_TRANSPORT
  default_transport: offline
  base_url_environment: LLM_BASE_URL
  default_base_url: http://127.0.0.1:8765/v1
  deployment_specification: ops/deploy/vllm_service.yml
  runtime: vllm==0.8.5
  format: awq
  architecture: LlamaForCausalLM
  attempt_timeout_seconds: 2
  sdk_retries: 0
  production_release_evidence_required: true
